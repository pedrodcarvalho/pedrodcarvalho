<svg xmlns="http://www.w3.org/2000/svg" width="580" height="220" viewBox="0 0 580 220" fill="none" role="img" aria-labelledby="st-t st-d">
<title id="st-t">GitHub telemetry</title>
<desc id="st-d">pedrodcarvalho: Last 365d 29, All time 639, Commits 567, Active days 282, Followers 5, Repos 68, Streak · now 0d, Streak · max 10d</desc>
<defs>
<pattern id="st-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="rgba(255,255,255,0.06)"/></pattern>
<radialGradient id="st-fade" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(70 0) rotate(90) scale(242 435)"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="st-m"><rect width="580" height="220" fill="url(#st-fade)"/></mask>
<linearGradient id="st-disp" x1="0" y1="0" x2="1" y2="0.09"><stop offset="0" stop-color="#3ddccb"/><stop offset="0.41" stop-color="#6ff0e0"/><stop offset="1" stop-color="#e8eaed"/></linearGradient>
<clipPath id="st-clip"><rect x="0.5" y="0.5" width="579" height="219" rx="16"/></clipPath>
</defs>
<style>
.sans{font-family:'Geist', 'Inter', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}
.mono{font-family:'Geist Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;text-transform:uppercase}
.eb{font-size:12px;letter-spacing:.16em;fill:#9aa0a6}
.sub{fill:#8a9097}
.mut{fill:#9aa0a6}
.fg{fill:#e8eaed}
.acc{fill:#3ddccb}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.85}70%,100%{transform:scale(3.2);opacity:0}}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}.pulse{opacity:0}.scan{display:none}}
</style>
<g clip-path="url(#st-clip)">
<rect width="580" height="220" fill="#111317"/>
<rect width="580" height="220" fill="url(#st-dots)" mask="url(#st-m)"/>

