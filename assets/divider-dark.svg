<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="img" aria-label="section divider">
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="rgba(255,255,255,0.16)" stop-opacity="0"/>
      <stop offset="0.15" stop-color="rgba(255,255,255,0.16)"/>
      <stop offset="0.85" stop-color="rgba(255,255,255,0.16)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.16)" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddccb" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#3ddccb" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#6ff0e0" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#fff"/>
      <stop offset="0.88" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="m"><rect width="1200" height="24" fill="url(#edge)"/></mask>
  </defs>
  <style>
    .pulse { animation: run 6s cubic-bezier(.5,0,.5,1) infinite; }
    @keyframes run { 0% { transform: translateX(0); } 100% { transform: translateX(1400px); } }
    .node { animation: glow 6s ease-in-out infinite; }
    @keyframes glow { 0%, 35%, 65%, 100% { opacity: .5; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .pulse { display: none; } }
  </style>
  <path d="M0 12 H586 M614 12 H1200" stroke="url(#hair)" stroke-width="1"/>
  <g mask="url(#m)">
    <g class="pulse">
      <rect x="-200" y="11" width="120" height="2" rx="1" fill="url(#pulse)"/>
      <circle cx="-80" cy="12" r="2.2" fill="#6ff0e0"/>
    </g>
  </g>
  <g class="node">
    <rect x="596" y="8" width="8" height="8" rx="1.5" transform="rotate(45 600 12)" fill="none" stroke="#3ddccb" stroke-width="1.2"/>
  </g>
  <path d="M574 12 H588 M612 12 H626" stroke="#3ddccb" stroke-width="1" opacity="0.6"/>
  <circle cx="600" cy="12" r="1.4" fill="#3ddccb"/>
</svg>
