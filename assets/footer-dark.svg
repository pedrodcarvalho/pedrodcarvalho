<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-labelledby="t">
  <title id="t">EOF · Thanks for stopping by · pedrodcarvalho.github.io</title>
  <defs>
    <clipPath id="frame"><rect width="1200" height="120" rx="16"/></clipPath>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.1" fill="rgba(255,255,255,0.075)"/>
    </pattern>
    <radialGradient id="glow" cx="630" cy="60" r="420" gradientUnits="userSpaceOnUse" gradientTransform="translate(630 60) scale(1 0.35) translate(-630 -60)">
      <stop offset="0" stop-color="#3ddccb" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3ddccb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trace" x1="458" y1="0" x2="840" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="rgba(255,255,255,0.16)" stop-opacity="0"/>
      <stop offset="0.1" stop-color="rgba(255,255,255,0.16)"/>
      <stop offset="0.9" stop-color="rgba(255,255,255,0.16)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.16)" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .sans { font-family: 'Geist', 'Inter', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Geist Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .s-only { display: none; }
    .live-ring { transform-box: fill-box; transform-origin: center; animation: ping 2.4s cubic-bezier(.2,.6,.3,1) infinite; }
    @keyframes ping { 0% { transform: scale(1); opacity: .75; } 80%, 100% { transform: scale(3.2); opacity: 0; } }
    .beam { stroke-dasharray: 140 1000; stroke-dashoffset: 140; animation: beam 4.2s linear infinite; }
    @keyframes beam { from { stroke-dashoffset: 140; } to { stroke-dashoffset: -1000; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .m-only, .scan { display: none !important; }
    .s-only { display: inline !important; } .beam { stroke-dasharray: none; stroke-dashoffset: 0; opacity: .55; }
  }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="120" fill="#0a0b0d"/>
    <rect width="1200" height="120" fill="url(#dots)" opacity="0.8"/>
    <rect width="1200" height="120" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="119" rx="15.5" fill="none" stroke="rgba(255,255,255,0.16)"/>

  <!-- left -->
  <circle class="live-ring" cx="56" cy="60" r="4" fill="rgba(255,181,71,0.4)"/>
  <circle cx="56" cy="60" r="4" fill="#ffb547"/>
  <text class="mono" x="72" y="65" font-size="15" letter-spacing="2.2" fill="#9aa0a6"><tspan fill="#e8eaed" font-weight="600">EOF</tspan> · THANKS FOR STOPPING BY<tspan class="cursor" fill="#3ddccb"> _</tspan></text>

  <!-- telemetry trace -->
  <path d="M458 60 L484 60 Q490 54 496 60 L508 60 L513 65 L519 34 L525 74 L530 60 L544 60 Q554 51 564 60 L610 60 Q616 54 622 60 L634 60 L639 65 L645 34 L651 74 L656 60 L670 60 Q680 51 690 60 L736 60 Q742 54 748 60 L760 60 L765 65 L771 34 L777 74 L782 60 L796 60 Q806 51 816 60 L840 60" fill="none" stroke="url(#trace)" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M458 60 L484 60 Q490 54 496 60 L508 60 L513 65 L519 34 L525 74 L530 60 L544 60 Q554 51 564 60 L610 60 Q616 54 622 60 L634 60 L639 65 L645 34 L651 74 L656 60 L670 60 Q680 51 690 60 L736 60 Q742 54 748 60 L760 60 L765 65 L771 34 L777 74 L782 60 L796 60 Q806 51 816 60 L840 60" pathLength="1000" class="beam" fill="none" stroke="#3ddccb" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" filter="url(#soft)"/>
  <text class="mono" x="468" y="94" font-size="14" letter-spacing="1.6" fill="#8a9097" opacity="0.85">SIGNAL · NOMINAL</text>
  <text class="mono" x="830" y="94" text-anchor="end" font-size="14" letter-spacing="1.6" fill="#8a9097" opacity="0.85">LINK · UP</text>

  <!-- right -->
  <text class="mono" x="1144" y="65" text-anchor="end" font-size="15" letter-spacing="0.6" fill="#3ddccb" font-weight="500">pedrodcarvalho.github.io <tspan fill="#9aa0a6">↗</tspan></text>
</svg>
