<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Architecture of the connected-vehicle system: CAN/OBD-II and GNSS feed the follower OBU; two OBUs exchange ETSI CAM messages over C-V2X at 900+ m; a roadside unit with OpenCV/YOLO pedestrian detection and SPaT/MAP feeds the leader; a test bench of dashboard, MQTT simulator, netem, CI/CD and ROS 2 supports it."><title>Building cars that talk to each other</title><defs>
