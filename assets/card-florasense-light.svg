<svg xmlns="http://www.w3.org/2000/svg" width="580" height="260" viewBox="0 0 580 260" role="img" aria-label="FloraSense: TinyML plant-health monitor. Health score 0.94 with live soil and climate sparklines."><title>FloraSense</title><defs><pattern id="d" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="rgba(14,16,19,0.07)"/></pattern><clipPath id="pc"><rect width="256" height="112" rx="12"/></clipPath><linearGradient id="fg" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".25" stop-color="#fff"/></linearGradient><mask id="fade"><rect x="124" y="30" width="122" height="76" fill="url(#fg)"/></mask></defs><style>
