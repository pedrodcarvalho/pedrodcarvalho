.blink{animation:blink 1.6s ease-in-out infinite}
@keyframes fill{0%{stroke-dashoffset:169.65}100%{stroke-dashoffset:13.57}}
@keyframes breathe{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-66px)}}
@keyframes blink{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
