<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">Pedro Domitti de Carvalho</title>
  <desc id="d">Engineering intelligence at the edge. AI, embedded systems and V2X. Animated scene: two connected vehicles exchanging packets over a 900+ metre C-V2X link, a roadside unit broadcasting, and a pedestrian detected with 0.94 confidence.</desc>
  <defs>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="420" rx="20"/></clipPath>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.1" fill="rgba(14,16,19,0.085)"/>
    </pattern>
    <radialGradient id="fade" cx="0.62" cy="0.55" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotmask"><rect width="1200" height="420" fill="url(#fade)"/></mask>
    <radialGradient id="glow" cx="880" cy="250" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b7a71" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#0b7a71" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#0b7a71" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90" cy="40" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b7a71" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#0b7a71" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="72" y1="0" x2="480" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b7a71"/>
      <stop offset="0.45" stop-color="#075e57"/>
      <stop offset="1" stop-color="#0d1c1d"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b7a71" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#0b7a71" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0b7a71" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="scanv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.8" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="scanmask"><rect x="600" y="40" width="580" height="340" fill="url(#scanv)"/></mask>
    <linearGradient id="ground" x1="600" y1="0" x2="1180" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="rgba(14,16,19,0.18)" stop-opacity="0"/>
      <stop offset="0.12" stop-color="rgba(14,16,19,0.18)"/>
      <stop offset="0.9" stop-color="rgba(14,16,19,0.18)"/>
      <stop offset="1" stop-color="rgba(14,16,19,0.18)" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .sans { font-family: 'Geist', 'Inter', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Geist Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .s-only { display: none; }
    .live-ring { transform-box: fill-box; transform-origin: center; animation: ping 2.4s cubic-bezier(.2,.6,.3,1) infinite; }
    .live-core { animation: breathe 2.4s ease-in-out infinite; }
    @keyframes ping { 0% { transform: scale(1); opacity: .75; } 80%, 100% { transform: scale(3.4); opacity: 0; } }
    @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .6; } }
    .wave { opacity: .2; animation: wave 2.1s ease-in-out infinite; }
    @keyframes wave { 0%, 100% { opacity: .14; } 35% { opacity: .95; } 70% { opacity: .14; } }
    .ring { transform-box: fill-box; transform-origin: center; opacity: 0; animation: ring 4.8s cubic-bezier(.25,.6,.35,1) infinite; }
    @keyframes ring { 0% { transform: scale(.15); opacity: .7; } 100% { transform: scale(1); opacity: 0; } }
    .link { stroke-dasharray: 3 6; animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -18; } }
    .v2i { stroke-dasharray: 2 6; animation: flow 2.4s linear infinite; }
    .scan { animation: scan 8s cubic-bezier(.45,0,.55,1) infinite; }
    @keyframes scan { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: 1; } 70% { opacity: 1; } 78%, 100% { transform: translateX(560px); opacity: 0; } }
    .bbox { animation: lock 4s ease-in-out infinite; }
    @keyframes lock { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
    .boxscan { animation: boxscan 2.6s ease-in-out infinite alternate; }
    @keyframes boxscan { from { transform: translateY(0); } to { transform: translateY(56px); } }
    .blink { animation: blink 1.2s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .m-only, .scan { display: none !important; }
    .s-only { display: inline !important; }
  }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="#f6f6f3"/>
    <rect width="1200" height="420" fill="url(#glow2)"/>
    <rect width="1200" height="420" fill="url(#dots)" mask="url(#dotmask)"/>
    <rect width="1200" height="420" fill="url(#glow)"/>
  </g>

  <!-- frame + instrument ticks -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="19.5" fill="none" stroke="rgba(14,16,19,0.18)"/>
  <path d="M18 30 V18 H30 M1170 18 H1182 V30 M18 390 V402 H30 M1170 402 H1182 V390" fill="none" stroke="#5f656c" stroke-width="1.25" opacity="0.7"/>

