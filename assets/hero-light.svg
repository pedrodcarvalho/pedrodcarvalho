    <circle class="live-core" cx="79" cy="91" r="4" fill="#8f4f00"/>
    <text x="94" y="96"><tspan fill="#8f4f00" font-weight="600">ONLINE</tspan> · CAMPINAS, BR · UTC−3</text>
  </g>

  <g class="sans" font-weight="700" font-size="62" letter-spacing="-1.6" fill="url(#name)">
    <text x="72" y="176">Pedro Domitti</text>
    <text x="72" y="242">de Carvalho</text>
  </g>

  <text class="sans" x="73" y="294" font-size="24" font-weight="500" fill="#0e1013" letter-spacing="-0.2">Engineering intelligence at the edge.</text>

  <line x1="73" y1="326" x2="101" y2="326" stroke="#0b7a71" stroke-width="2" stroke-linecap="round"/>
  <text class="mono" x="113" y="331" font-size="14" letter-spacing="2.6" fill="#0b7a71" font-weight="500">AI · EMBEDDED SYSTEMS · V2X</text>
  <text class="mono" x="73" y="366" font-size="14" letter-spacing="1.6" fill="#5f656c">ID · PDC  //  COMPUTER ENGINEERING</text>

  <!-- ============ RIGHT: V2X scene ============ -->
  <text class="mono" x="1146" y="96" text-anchor="end" font-size="14" letter-spacing="2.2" fill="#5f656c">FIG.01 · CACC PLATOON · C-V2X</text>

  <!-- scan line -->
  <g mask="url(#scanmask)">
    <g class="scan" opacity="0.22">
      <rect x="570" y="40" width="50" height="340" fill="url(#scan)"/>
    </g>
  </g>

  <!-- ground + ruler -->
  <line x1="600" y1="330" x2="1180" y2="330" stroke="url(#ground)" stroke-width="1"/>
  <g stroke="rgba(14,16,19,0.18)" stroke-width="1"><line x1="620" y1="330" x2="620" y2="337"/><line x1="630" y1="330" x2="630" y2="333.5"/><line x1="640" y1="330" x2="640" y2="333.5"/><line x1="650" y1="330" x2="650" y2="333.5"/><line x1="660" y1="330" x2="660" y2="333.5"/><line x1="670" y1="330" x2="670" y2="337"/><line x1="680" y1="330" x2="680" y2="333.5"/><line x1="690" y1="330" x2="690" y2="333.5"/><line x1="700" y1="330" x2="700" y2="333.5"/><line x1="710" y1="330" x2="710" y2="333.5"/><line x1="720" y1="330" x2="720" y2="337"/><line x1="730" y1="330" x2="730" y2="333.5"/><line x1="740" y1="330" x2="740" y2="333.5"/><line x1="750" y1="330" x2="750" y2="333.5"/><line x1="760" y1="330" x2="760" y2="333.5"/><line x1="770" y1="330" x2="770" y2="337"/><line x1="780" y1="330" x2="780" y2="333.5"/><line x1="790" y1="330" x2="790" y2="333.5"/><line x1="800" y1="330" x2="800" y2="333.5"/><line x1="810" y1="330" x2="810" y2="333.5"/><line x1="820" y1="330" x2="820" y2="337"/><line x1="830" y1="330" x2="830" y2="333.5"/><line x1="840" y1="330" x2="840" y2="333.5"/><line x1="850" y1="330" x2="850" y2="333.5"/><line x1="860" y1="330" x2="860" y2="333.5"/><line x1="870" y1="330" x2="870" y2="337"/><line x1="880" y1="330" x2="880" y2="333.5"/><line x1="890" y1="330" x2="890" y2="333.5"/><line x1="900" y1="330" x2="900" y2="333.5"/><line x1="910" y1="330" x2="910" y2="333.5"/><line x1="920" y1="330" x2="920" y2="337"/><line x1="930" y1="330" x2="930" y2="333.5"/><line x1="940" y1="330" x2="940" y2="333.5"/><line x1="950" y1="330" x2="950" y2="333.5"/><line x1="960" y1="330" x2="960" y2="333.5"/><line x1="970" y1="330" x2="970" y2="337"/><line x1="980" y1="330" x2="980" y2="333.5"/><line x1="990" y1="330" x2="990" y2="333.5"/><line x1="1000" y1="330" x2="1000" y2="333.5"/><line x1="1010" y1="330" x2="1010" y2="333.5"/><line x1="1020" y1="330" x2="1020" y2="337"/><line x1="1030" y1="330" x2="1030" y2="333.5"/><line x1="1040" y1="330" x2="1040" y2="333.5"/><line x1="1050" y1="330" x2="1050" y2="333.5"/><line x1="1060" y1="330" x2="1060" y2="333.5"/><line x1="1070" y1="330" x2="1070" y2="337"/><line x1="1080" y1="330" x2="1080" y2="333.5"/><line x1="1090" y1="330" x2="1090" y2="333.5"/><line x1="1100" y1="330" x2="1100" y2="333.5"/><line x1="1110" y1="330" x2="1110" y2="333.5"/><line x1="1120" y1="330" x2="1120" y2="337"/><line x1="1130" y1="330" x2="1130" y2="333.5"/><line x1="1140" y1="330" x2="1140" y2="333.5"/><line x1="1150" y1="330" x2="1150" y2="333.5"/><line x1="1160" y1="330" x2="1160" y2="333.5"/><line x1="1170" y1="330" x2="1170" y2="337"/></g>

