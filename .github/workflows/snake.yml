name: snake

# Brand-coloured contribution snake, published to the `output` branch:
#   https://raw.githubusercontent.com/pedrodcarvalho/pedrodcarvalho/output/github-snake.svg
#   https://raw.githubusercontent.com/pedrodcarvalho/pedrodcarvalho/output/github-snake-dark.svg
on:
  schedule:
    - cron: "41 6 * * *" # daily, 03:41 in Campinas (UTC-3)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#8f4f00&color_dots=#ebedf0,#b8ece6,#6fd3c7,#1fa797,#0b7a71
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ffb547&color_dots=#161b22,#0e4a45,#167a70,#26b3a3,#3ddccb

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore(snake): update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
